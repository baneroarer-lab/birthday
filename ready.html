<!DOCTYPE html>
<html>
<head>
<title>Ready?</title>

<style>
body {
  text-align:center;
  background:black;
  color:white;
  font-family:sans-serif;
}

button {
  padding:15px 25px;
  font-size:18px;
  margin:10px;
  position:relative;
}
</style>
</head>

<body>

<h1>Are you ready? 😏</h1>

<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" width="200">

<br><br>

<button id="yes" onclick="go()">YES 😍</button>
<button onclick="no()">NO 😈</button>

<script>

let count = 0;

document.getElementById("yes").onmouseover = function(){
  if(count < 2){
    this.style.position="absolute";
    this.style.left=Math.random()*80+"%";
    this.style.top=Math.random()*80+"%";
    count++;
  }
}

function go(){
  window.location.href="wish.html";
}

function no(){
  alert("You really thought NO was an option? 😂");
}

</script>

</body>
</html>
