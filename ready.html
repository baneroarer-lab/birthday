<!DOCTYPE html>
<html>
<head>
<title>Ready?</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;

    /* 💖 Pink + Purple Gradient */
    background: linear-gradient(135deg, #ff9a9e, #a18cd1);
    height: 100vh;
    color: white;
}

/* Center everything nicely */
.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Buttons styling */
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff1e4d;
    transform: scale(1.1);
}

/* Image styling */
img {
    max-width: 250px;
    margin: 15px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* Glow text */
h1 {
    text-shadow: 0 0 10px white, 0 0 20px pink;
}
</style>
body {
  text-align:center;
  background:black;
  color:white;
  font-family:sans-serif;
}

button {
  padding:15px 25px;
  font-size:18px;
  margin:10px;
  position:relative;
}
</style>
</head>

<body>

<h1>Are you ready? 😏</h1>

<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" width="200">

<br><br>

<button id="yes" onclick="go()">YES 😍</button>
<button onclick="no()">NO 😈</button>

<script>

let count = 0;

const yesBtn = document.getElementById("yes");

// 🏃 YES button runs away twice
yesBtn.onmouseover = function(){
  if(count < 2){
    this.style.position="absolute";
    this.style.left=Math.random()*80+"%";
    this.style.top=Math.random()*80+"%";
    count++;
  }
}

function go(){
  window.location.href="wish.html";
}

// 😈 FUNNY NO RESPONSE
function no(){

  document.body.innerHTML = `
    <h1>😤 Seriously? NO?</h1>
    <p>You really gonna say NO on a birthday?? 😑</p>

    <img src="https://media.giphy.com/media/3o7btPCcdNniyf0ArS/giphy.gif" width="250">

    <p>Try again… and choose wisely 😌👇</p>

    <button onclick="location.reload()">Go Back 😅</button>
  `;
}

</script>

</body>
</html>
