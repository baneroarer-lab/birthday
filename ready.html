<!DOCTYPE html>
<html>
<head>
<title>Ready?</title>

<style>
body {
  text-align: center;
  background: url('luffy.jpg') no-repeat center/cover;
  color: white;
  font-family: Arial;
}

img {
  width: 200px;
  margin-top: 20px;
  border-radius: 20px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Are you ready? 😏</h1>

<img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">

<br>

<button onclick="goNext()">YES 😍</button>
<button onclick="moveButton(this)">NO 😤</button>

<script>
function goNext() {
  document.body.innerHTML = "<h1>Wait... 😏</h1>";
  
  setTimeout(() => {
    window.location.href = "wish.html";
  }, 2000);
}

function moveButton(btn) {
  btn.style.position = "absolute";
  btn.style.top = Math.random()*300 + "px";
  btn.style.left = Math.random()*300 + "px";
}
</script>

</body>
</html>
