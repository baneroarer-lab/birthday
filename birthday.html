<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday 🎂</title>

<style>
body {
  text-align:center;
  font-family:sans-serif;
  background:black;
  color:white;
  overflow:hidden;
}

h1 {
  font-size:50px;
  color:#ff4d6d;
}

img {
  width:200px;
  margin:10px;
  border-radius:10px;
}

.flower {
  position:fixed;
  top:-50px;
  width:40px;
  animation:fall linear forwards;
}

@keyframes fall {
  to {
    transform:translateY(100vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday 🎂</h1>

<p>
You’re chaos like Luffy 😂  
Cool like Gojo 😎  
Strong like Zoro 💪  
Deep like Itachi 🖤  

Stay crazy… life is better with you 🔥  
</p>

<img src="photo.png">
<img src="luffy.jpg">

<!-- MUSIC -->
<audio id="music" loop>
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid">
</audio>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

// play music after click
document.body.addEventListener("click", () => {
  document.getElementById("music").play();
});

// confetti
setInterval(()=>{
  confetti({
    particleCount:80,
    spread:70,
    origin:{y:0.6}
  });
},2000);

// flowers FIXED (visible now)
function flower(){
  let f=document.createElement("img");

  if(Math.random()>0.7){
    f.src="sunflower.jpg";
  } else {
    f.src="rose.jpg";
  }

  f.className="flower";
  f.style.left=Math.random()*window.innerWidth+"px";
  f.style.animationDuration=(4+Math.random()*3)+"s";

  document.body.appendChild(f);

  setTimeout(()=>f.remove(),8000);
}

setInterval(flower,400);

</script>

</body>
</html>
