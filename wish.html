<!DOCTYPE html>
<html>
<head>
<title>Make a Wish 🎂</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;

    /* 💖 Pink + Purple Gradient (FIXED) */
    background: linear-gradient(135deg, #ff9a9e, #a18cd1);
    height: 100vh;
    color: white;
}

/* Center everything */
.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Buttons */
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff1e4d;
    transform: scale(1.1);
}

/* Image */
img {
    max-width: 250px;
    margin: 15px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* Glow heading */
h1 {
    text-shadow: 0 0 10px white, 0 0 20px pink;
}
</style>

</head>

<body>

<div class="container">

<h1>🎂 Make a Wish 🎂</h1>

<p>Close your eyes… make a wish… then blow the candle 🎂</p>

<img src="cake.jpg" id="cake">

<br>

<button onclick="blow()">Blow Candle 🕯️</button>
<button onclick="noClick()">No 😒</button>

</div>

<!-- 🎵 MUSIC -->
<!-- 🎵 MUSIC -->
<audio id="music" loop>
  <source src="line.mp3" type="audio/mpeg">
</audio>

<script>
let music = document.getElementById("music");

// ▶️ Start music on first click
document.body.addEventListener("click", function startMusic() {
    music.play().catch(()=>{});
    document.body.removeEventListener("click", startMusic);
});

// 💾 Save current time before leaving page
function saveMusicTime() {
    localStorage.setItem("musicTime", music.currentTime);
}

// 🎂 Blow animation
function blow(){

  saveMusicTime(); // 🔥 save before transition

  document.body.innerHTML = "<h1>✨ Making your wish...</h1>";

  setTimeout(()=>{
    document.body.innerHTML = "<img src='zoro.jpg'>";
  },1000);

  setTimeout(()=>{
    document.body.innerHTML = "<img src='gojo.jpg'>";
  },2000);

  setTimeout(()=>{
    document.body.innerHTML = "<img src='itachi.jpg'>";
  },3000);

  setTimeout(()=>{
    window.location.href="birthday.html";
  },4000);
}

// 😆 Playful NO button
function noClick(){
  alert("😒 Oye... don't act smart. Press 'Blow Candle' properly 🎂😤");
}

</script>

</body>
</html>
