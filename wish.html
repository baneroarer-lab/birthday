<!DOCTYPE html>
<html>
<head>
<title>Make a Wish</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;

    /* 💖 Pink + Purple Gradient */
    background: linear-gradient(135deg, #ff9a9e, #a18cd1);
    height: 100vh;
    color: white;
}

/* Center everything nicely */
.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Buttons styling */
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff1e4d;
    transform: scale(1.1);
}

/* Image styling */
img {
    max-width: 250px;
    margin: 15px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* Glow text */
h1 {
    text-shadow: 0 0 10px white, 0 0 20px pink;
}
</style>
body {
  text-align:center;
  background:black;
  color:white;
  font-family:sans-serif;
}

img {
  width:250px;
  border-radius:10px;
}

button {
  padding:15px 25px;
  font-size:18px;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>🎂 Make a Wish</h1>

<p>Close your eyes… make a wish… then blow candle 🎂</p>

<img src="cake.jpg" id="cake">

<br>

<button onclick="blow()">Blow Candle 🕯️</button>

<script>

function blow(){
  document.body.innerHTML = "<h1>✨ Making your wish...</h1>";

  setTimeout(()=>{
    document.body.innerHTML = "<img src='zoro.jpg'>";
  },1000);

  setTimeout(()=>{
    document.body.innerHTML = "<img src='gojo.jpg'>";
  },2000);

  setTimeout(()=>{
    document.body.innerHTML = "<img src='itachi.jpg'>";
  },3000);

  setTimeout(()=>{
    window.location.href="birthday.html";
  },4000);
}

</script>

</body>
</html>
