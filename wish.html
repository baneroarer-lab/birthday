<!DOCTYPE html>
<html>
<head>
<title>Make a Wish</title>

<style>
body {
  text-align:center;
  background:black;
  color:white;
  font-family:sans-serif;
}

img {
  width:250px;
  border-radius:10px;
}

button {
  padding:15px 25px;
  font-size:18px;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>🎂 Make a Wish</h1>

<p>Close your eyes… make a wish… then blow candle 🎂</p>

<img src="cake.jpg" id="cake">

<br>

<button onclick="blow()">Blow Candle 🕯️</button>

<script>

function blow(){
  document.body.innerHTML = "<h1>✨ Making your wish...</h1>";

  setTimeout(()=>{
    document.body.innerHTML = "<img src='zoro.jpg'>";
  },1000);

  setTimeout(()=>{
    document.body.innerHTML = "<img src='gojo.jpg'>";
  },2000);

  setTimeout(()=>{
    document.body.innerHTML = "<img src='itachi.jpg'>";
  },3000);

  setTimeout(()=>{
    window.location.href="birthday.html";
  },4000);
}

</script>

</body>
</html>
