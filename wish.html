<!DOCTYPE html>
<html>
<head>
<title>Make a Wish</title>

<style>
body {
  text-align: center;
  background: black;
  color: white;
  font-family: Arial;
}

img {
  width: 250px;
}

button {
  padding: 10px 20px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Make a wish... 🥺✨</h1>

<img src="https://i.imgur.com/3ZQ3Z6F.png" id="cake">

<br><br>

<button onclick="blow()">Blow Candle 🕯️</button>

<script>
function blow() {
  document.body.innerHTML = "<h1>✨ Wish Granted ✨</h1>";
  
  setTimeout(() => {
    window.location.href = "birthday.html";
  }, 2000);
}
</script>

</body>
</html>
