<!DOCTYPE html>
<html>
<head>

<title>Make a Wish 🎂</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;

    /* 🌸 FLOWER BACKGROUND */
    background-image:
        linear-gradient(
            rgba(20, 0, 30, 0.45),
            rgba(20, 0, 30, 0.45)
        ),
        url("flower.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    height: 100vh;
    overflow: hidden;
}

.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
}

/* 🎂 Heading */
h1 {
    font-size: 40px;
    text-shadow:
        0 0 10px white,
        0 0 20px pink,
        0 0 35px #ff69b4;
}

/* 💬 Text */
p {
    font-size: 18px;
    text-shadow:
        0 0 8px white,
        0 0 15px pink;
}

/* 👉 Blinking hint */
@keyframes blink {
    0% {
        opacity: 0.5;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.5;
    }
}

.music-hint {
    font-size: 14px;
    text-shadow: 0 0 10px white;
    animation: blink 1.5s infinite;
}

/* 🎂 Cake */
.cake {
    max-width: 250px;
    width: 80%;
    margin: 15px;
    border-radius: 15px;

    box-shadow:
        0 0 20px rgba(255,255,255,0.6),
        0 0 40px rgba(255,105,180,0.5);

    transition: 0.3s;
}

.cake:hover {
    transform: scale(1.05);
}

/* 💗 Buttons */
button {
    padding: 12px 20px;
    margin: 10px;

    border: none;
    border-radius: 10px;

    background: #ff4d6d;
    color: white;

    font-size: 16px;
    cursor: pointer;

    transition: 0.3s;

    box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

button:hover {
    background: #ff1e4d;
    transform: scale(1.1);

    box-shadow: 0 0 20px rgba(255,255,255,0.8);
}

/* ✨ Transition images */
.transition-img {
    max-width: 280px;
    width: 80%;

    border-radius: 15px;

    box-shadow:
        0 0 25px white,
        0 0 45px pink;

    animation: appear 1s ease;
}

@keyframes appear {

    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}

</style>

</head>

<body>

<div id="content" class="container">

    <h1>🎂 Make a Wish 🎂</h1>

    <p>
        Close your eyes… make a wish… then blow the candle 🎂
    </p>

    <p class="music-hint">
        👉 Tap anywhere to start 🎵
    </p>

    <img
        src="cake.jpg"
        class="cake"
        alt="Birthday Cake"
    >

    <br>

    <div>

        <button onclick="blow()">
            Blow Candle 🕯️
        </button>

        <button onclick="noClick()">
            No 😒
        </button>

    </div>

</div>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
    <source src="line.mp3" type="audio/mpeg">
</audio>

<script>

let music = document.getElementById("music");

/* 🎵 Start music on first tap */
document.body.addEventListener("click", function startMusic() {

    music.play().catch(() => {});

    document.body.removeEventListener("click", startMusic);

});


/* 💾 Save music time */
function saveMusicTime() {

    localStorage.setItem(
        "musicTime",
        music.currentTime
    );

}


/* 🎂 Blow Candle */
function blow() {

    saveMusicTime();

    let content = document.getElementById("content");

    /* ✨ Making wish */
    content.innerHTML = `
        <h1>✨ Making your wish... ✨</h1>
    `;

    /* 🗡️ Zoro */
    setTimeout(() => {

        content.innerHTML = `
            <img
                src="zoro.jpg"
                class="transition-img"
                alt="Zoro"
            >
        `;

    }, 1000);

    /* 👁️ Gojo */
    setTimeout(() => {

        content.innerHTML = `
            <img
                src="gojo.jpg"
                class="transition-img"
                alt="Gojo"
            >
        `;

    }, 2000);

    /* 🔥 Itachi */
    setTimeout(() => {

        content.innerHTML = `
            <img
                src="itachi.jpg"
                class="transition-img"
                alt="Itachi"
            >
        `;

    }, 3000);

    /* 🎉 Birthday page */
    setTimeout(() => {

        window.location.href = "birthday.html";

    }, 4000);

}


/* 😆 NO BUTTON */
function noClick() {

    alert(
        "😒 Don't act smart… press Blow Candle 🎂"
    );

}

</script>

</body>
</html>
