<!DOCTYPE html>
<html>
<head>
<title>Make a Wish 🎂</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #a18cd1);
    height: 100vh;
    color: white;
}

.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Buttons */
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff1e4d;
    transform: scale(1.1);
}

/* Image */
img {
    max-width: 250px;
    margin: 15px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* Glow text */
h1 {
    text-shadow: 0 0 10px white, 0 0 20px pink;
}

/* blinking hint */
@keyframes blink {
  0% {opacity: 0.5;}
  50% {opacity: 1;}
  100% {opacity: 0.5;}
}
</style>
</head>

<body>

<div id="content" class="container">

<h1>🎂 Make a Wish 🎂</h1>

<p>Close your eyes… make a wish… then blow the candle 🎂</p>

<p style="font-size:14px; text-shadow:0 0 10px white; animation:blink 1.5s infinite;">
👉 Tap anywhere to start 🎵
</p>

<img src="cake.jpg">

<br>

<button onclick="blow()">Blow Candle 🕯️</button>
<button onclick="noClick()">No 😒</button>

</div>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
  <source src="line.mp3" type="audio/mpeg">
</audio>

<script>
let music = document.getElementById("music");

// ▶️ Start music on first tap
document.body.addEventListener("click", function startMusic() {
    music.play().catch(()=>{});
    document.body.removeEventListener("click", startMusic);
});

// 💾 Save music time
function saveMusicTime() {
    localStorage.setItem("musicTime", music.currentTime);
}

// 🎂 Blow animation (WITHOUT breaking music)
function blow(){

  saveMusicTime();

  let content = document.getElementById("content");

  content.innerHTML = "<h1>✨ Making your wish...</h1>";

  setTimeout(()=>{
    content.innerHTML = "<img src='zoro.jpg'>";
  },1000);

  setTimeout(()=>{
    content.innerHTML = "<img src='gojo.jpg'>";
  },2000);

  setTimeout(()=>{
    content.innerHTML = "<img src='itachi.jpg'>";
  },3000);

  setTimeout(()=>{
    window.location.href="birthday.html";
  },4000);
}

// 😆 Playful NO
function noClick(){
  alert("😒 Don't act smart… press Blow Candle 🎂");
}
</script>

</body>
</html>
