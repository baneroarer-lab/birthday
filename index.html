<!DOCTYPE html>
<html>
<head>
<title>Unlock 🎁</title>
<style>
body {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family:sans-serif;
}
.box {
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
}
button {
  background:#ff4d6d;
  color:white;
  padding:10px 20px;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>
<div class="box">
<h2>🔐 Enter Secret Password</h2>
<input type="password" id="pass"><br><br>
<button onclick="check()">Unlock</button>
</div>

<script>
function check(){
  if(document.getElementById("pass").value === "china2006"){
    window.location.href="ready.html";
  } else {
    alert("Wrong 😅");
  }
}
</script>
</body>
</html>
